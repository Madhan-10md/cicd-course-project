apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleaning temporary files..."
        rm -rf /workspace/source/__pycache__
        rm -rf /workspace/source/.pytest_cache
        rm -rf /workspace/source/build
        rm -rf /workspace/source/dist
        echo "Cleanup completed."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose-test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.11-slim
      workingDir: /workspace/source
      script: |
        #!/bin/sh
        python -m pip install --no-cache-dir nose
        nosetests -v
